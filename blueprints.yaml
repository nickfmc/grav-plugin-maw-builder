name: MAW Builder
slug: maw-builder
type: plugin
version: 1.2.0
homepage: https://github.com/nickfmc/grav-plugin-maw-builder
bugs: https://github.com/nickfmc/grav-plugin-maw-builder/issues
description: WordPress-style visual page builder for Admin2. Live preview, block inserter, patterns, media picker. Saves plain `blocks:` YAML.
icon: wand-magic-sparkles
author:
  name: Mountain Air Web
  email: nick@mountainairweb.com
  url: https://mountainairweb.com
keywords: page builder, blocks, visual editor, admin2, gutenberg, elementor
license: MIT
compatibility:
  grav: ['2.1']
dependencies:
  - { name: grav, version: '>=2.1.0' }
  - { name: api, version: '>=1.0.30' }
  - { name: admin2, version: '>=2.1.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
      validate: { type: bool }
    replace_field:
      type: toggle
      label: Replace the Blocks list field with the visual builder
      help: When off, pages keep the native Admin2 list field.
      highlight: 1
      default: 1
      options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
      validate: { type: bool }
    preview_ttl:
      type: number
      label: Preview draft lifetime (seconds)
      default: 900
      validate: { type: int, min: 60 }
    preview_template:
      type: text
      label: Preview page template
      help: The theme template that renders a page made only of blocks; used for Flex object previews.
      default: blocks
    max_payload_kb:
      type: number
      label: Largest blocks payload (KB)
      default: 512
      validate: { type: int, min: 64 }
    revisions.keep:
      type: number
      label: Revisions kept per page
      default: 50
      validate: { type: int, min: 5 }
    devices:
      type: fieldset
      title: Device preview widths
      fields:
        devices.tablet: { type: number, label: Tablet width (px), default: 820, validate: { type: int } }
        devices.mobile: { type: number, label: Mobile width (px), default: 390, validate: { type: int } }
